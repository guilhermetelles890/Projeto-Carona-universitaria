{% extends "base.html" %}

{% block title %}Cadastro - UniDriver{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-container">

        <div class="form-header">
            <h1>Crie sua conta</h1>

            <p>
                Cadastre-se no UniDriver e faça parte da comunidade
                universitária.
            </p>
        </div>

        <form method="POST" action="{{ url_for('cadastro') }}">

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail institucional</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@universidade.edu.br"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <input
                    type="text"
                    id="curso"
                    name="curso"
                    placeholder="Digite seu curso"
                    required
                >
            </div>

            <div class="form-group">
                <label for="campus">Campus</label>
                <input
                    type="text"
                    id="campus"
                    name="campus"
                    placeholder="Digite seu campus"
                    required
                >
            </div>

            <div class="form-group">
                <label for="tipo_usuario">Como você pretende utilizar o UniDriver?</label>

                <select id="tipo_usuario" name="tipo_usuario" required>
                    <option value="" selected disabled>
                        Selecione uma opção
                    </option>

                    <option value="passageiro">
                        Passageiro
                    </option>

                    <option value="motorista">
                        Motorista
                    </option>

                    <option value="ambos">
                        Motorista e passageiro
                    </option>
                </select>
            </div>

            <button type="submit" class="form-button">
                Criar conta
            </button>

        </form>

        <div class="form-footer">
            <p>
                Já possui uma conta?
                <a href="#">Entrar</a>
            </p>
        </div>

    </div>

</section>

{% endblock %}
