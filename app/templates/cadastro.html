{% extends "base.html" %}

{% block title %}Cadastro - UniDriver{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-container">

        <div class="form-header">
            <h1>Crie sua conta</h1>

            <p>
                Cadastre-se no UniDriver e faça parte da comunidade
                universitária.
            </p>
        </div>

        <form method="POST" action="{{ url_for('cadastro') }}">

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail institucional</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@universidade.edu.br"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="curso">Curso</label>
                <input
                    type="text"
                    id="curso"
                    name="curso"
                    placeholder="Digite seu curso"
                >
            </div>

            <div class="form-group">
                <label for="campus">Campus</label>
                <input
                    type="text"
                    id="campus"
                    name="campus"
                    placeholder="Digite seu campus"
                >
            </div>

            <div class="form-group">
                <label for="tipo_usuario">Como você pretende utilizar o UniDriver?</label>

                <select id="tipo_usuario" name="tipo_usuario" required>
                    <option value="" selected disabled>
                        Selecione uma opção
                    </option>

                    <option value="passageiro">
                        Passageiro
                    </option>

                    <option value="motorista">
                        Motorista
                    </option>

                    <option value="ambos">
                        Motorista e passageiro
                    </option>
                </select>
            </div>

            <div class="form-group" id="cnh-group" style="display: none;">
                <label for="cnh">CNH</label>
                <input
                    type="text"
                    id="cnh"
                    name="cnh"
                    placeholder="Digite o número da sua CNH"
                >
            </div>

            <button type="submit" class="form-button">
                Criar conta
            </button>

        </form>

        <div class="form-footer">
            <p>
                Já possui uma conta?
                <a href="#">Entrar</a>
            </p>
        </div>

    </div>

</section>

<script>
    const tipoUsuarioSelect = document.getElementById('tipo_usuario');
    const cnhGroup = document.getElementById('cnh-group');
    const cnhInput = document.getElementById('cnh');
    const cursoInput = document.getElementById('curso');
    const campusInput = document.getElementById('campus');

    function atualizarCampoCnh() {
        const precisaDeCnh = tipoUsuarioSelect.value === 'motorista' || tipoUsuarioSelect.value === 'ambos';

        cnhGroup.style.display = precisaDeCnh ? 'block' : 'none';
        cnhInput.required = precisaDeCnh;

        if (!precisaDeCnh) {
            cnhInput.value = '';
        }
    }

    function atualizarCursoECampus() {
        const ehSomenteMotorista = tipoUsuarioSelect.value === 'motorista';

        cursoInput.required = !ehSomenteMotorista;
        campusInput.required = !ehSomenteMotorista;
    }

    tipoUsuarioSelect.addEventListener('change', atualizarCampoCnh);
    tipoUsuarioSelect.addEventListener('change', atualizarCursoECampus);

    atualizarCampoCnh();
    atualizarCursoECampus();
</script>

{% endblock %}
